<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="flyer1_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C16"/>
      <stop offset="50%" stop-color="#14182E"/>
      <stop offset="100%" stop-color="#07080F"/>
    </linearGradient>
    <linearGradient id="neon_indigo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Print Sheet Background (Simulating A4 Artboard) -->
  <rect x="0" y="0" width="600" height="800" fill="#030408"/>

  <!-- Printer Crop Marks (Trim & Bleed Marks) -->
  <line x1="15" y1="30" x2="35" y2="30" stroke="#475569" stroke-width="1"/>
  <line x1="30" y1="15" x2="30" y2="35" stroke="#475569" stroke-width="1"/>
  <line x1="565" y1="30" x2="585" y2="30" stroke="#475569" stroke-width="1"/>
  <line x1="570" y1="15" x2="570" y2="35" stroke="#475569" stroke-width="1"/>
  <line x1="15" y1="770" x2="35" y2="770" stroke="#475569" stroke-width="1"/>
  <line x1="30" y1="765" x2="30" y2="785" stroke="#475569" stroke-width="1"/>
  <line x1="565" y1="770" x2="585" y2="770" stroke="#475569" stroke-width="1"/>
  <line x1="570" y1="765" x2="570" y2="785" stroke="#475569" stroke-width="1"/>

  <!-- Main Flyer Content Canvas (Inside Bleed) -->
  <rect x="30" y="30" width="540" height="740" fill="url(#flyer1_grad)" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Swiss Style Grid Lines -->
  <line x1="30" y1="120" x2="570" y2="120" stroke="#334155" stroke-width="1"/>
  <line x1="200" y1="30" x2="200" y2="120" stroke="#334155" stroke-width="1"/>
  <line x1="380" y1="30" x2="380" y2="120" stroke="#334155" stroke-width="1"/>

  <!-- Top Metadata Header Strip -->
  <text x="50" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">INTENSIVE WORKSHOP</text>
  <text x="50" y="90" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">SERIES 04</text>

  <text x="220" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">DATE &amp; TIME</text>
  <text x="220" y="90" fill="#06B6D4" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">SAT, NOV 14 // 10AM</text>

  <text x="400" y="65" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">LOCATION</text>
  <text x="400" y="90" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">NORRSHEN KIGALI</text>

  <!-- Big Bold Typography Headline -->
  <g transform="translate(50, 190)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5">MULTIMODAL AI &amp;</text>
    <text x="0" y="55" fill="url(#neon_indigo)" font-family="'Space Grotesk', sans-serif" font-size="44" font-weight="900" letter-spacing="-1.5">SYSTEMS SCALE</text>
  </g>

  <text x="50" y="285" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16" font-weight="400">Mastering OCR reasoning, LLM streaming pipelines, and local caching.</text>

  <!-- Workshop Curriculum Modules (3 distinct blocks) -->
  <g transform="translate(50, 325)">
    <rect x="0" y="0" width="500" height="85" rx="10" fill="#0C1020" stroke="#1E293B"/>
    <rect x="15" y="15" width="30" height="30" rx="6" fill="#6366F1" fill-opacity="0.2"/>
    <text x="30" y="36" fill="#818CF8" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">01</text>
    <text x="60" y="34" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Multimodal OCR &amp; Vision Pipelines</text>
    <text x="60" y="58" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Gemini Flash integration, zero-data-entry parsers, and schema validation.</text>

    <rect x="0" y="100" width="500" height="85" rx="10" fill="#0C1020" stroke="#1E293B"/>
    <rect x="15" y="115" width="30" height="30" rx="6" fill="#06B6D4" fill-opacity="0.2"/>
    <text x="30" y="136" fill="#22D3EE" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">02</text>
    <text x="60" y="134" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Sub-100ms Streaming &amp; Reactive UI</text>
    <text x="60" y="158" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">SSE streaming, optimistic updates, and tactile Framer Motion states.</text>

    <rect x="0" y="200" width="500" height="85" rx="10" fill="#0C1020" stroke="#1E293B"/>
    <rect x="15" y="215" width="30" height="30" rx="6" fill="#10B981" fill-opacity="0.2"/>
    <text x="30" y="236" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" text-anchor="middle">03</text>
    <text x="60" y="234" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="17" font-weight="700">Production Deployment &amp; Rate Limiting</text>
    <text x="60" y="258" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Redis caching, fallback circuits, and zero-downtime containerization.</text>
  </g>

  <!-- Instructor / Host -->
  <g transform="translate(50, 635)">
    <text x="0" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">LEAD INSTRUCTOR</text>
    <text x="0" y="45" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Meekness Bonheur</text>
    <text x="0" y="68" fill="#818CF8" font-family="'Inter', sans-serif" font-size="13">Full-Stack Engineer &amp; UI Architect</text>
  </g>

  <!-- Registration QR Box -->
  <g transform="translate(420, 620)">
    <rect x="0" y="0" width="130" height="90" rx="10" fill="#FFFFFF"/>
    <rect x="10" y="10" width="22" height="22" fill="#0F172A"/>
    <rect x="50" y="10" width="22" height="22" fill="#0F172A"/>
    <rect x="10" y="45" width="22" height="22" fill="#0F172A"/>
    <rect x="35" y="30" width="18" height="18" fill="#6366F1"/>
    <text x="80" y="35" fill="#0F172A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">SCAN TO</text>
    <text x="80" y="50" fill="#0F172A" font-family="'Space Grotesk', sans-serif" font-size="11" font-weight="800">RESERVE</text>
    <text x="80" y="68" fill="#6366F1" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">FREE ENTRY</text>
  </g>

  <!-- Technical Print Footer -->
  <text x="300" y="745" fill="#475569" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">A4 PRINT FLYER // 210 x 297 mm // 300 DPI // 170gsm MATTE ART PAPER</text>
</svg>
