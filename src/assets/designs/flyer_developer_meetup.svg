<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="flyer2_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0C08"/>
      <stop offset="50%" stop-color="#1F160C"/>
      <stop offset="100%" stop-color="#080604"/>
    </linearGradient>
    <linearGradient id="amber_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EF4444"/>
    </linearGradient>
  </defs>

  <!-- Print Artboard with Bleed -->
  <rect x="0" y="0" width="600" height="800" fill="#040302"/>

  <!-- Registration Marks -->
  <circle cx="30" cy="30" r="10" fill="none" stroke="#64748B" stroke-width="0.8"/>
  <line x1="20" y1="30" x2="40" y2="30" stroke="#64748B" stroke-width="0.8"/>
  <line x1="30" y1="20" x2="30" y2="40" stroke="#64748B" stroke-width="0.8"/>
  
  <circle cx="570" cy="30" r="10" fill="none" stroke="#64748B" stroke-width="0.8"/>
  <line x1="560" y1="30" x2="580" y2="30" stroke="#64748B" stroke-width="0.8"/>
  <line x1="570" y1="20" x2="570" y2="40" stroke="#64748B" stroke-width="0.8"/>

  <!-- Poster Body -->
  <rect x="30" y="30" width="540" height="740" fill="url(#flyer2_grad)" stroke="#271C10" stroke-width="1.5"/>

  <!-- Background Isometric Grid Silhouette -->
  <path d="M30 350 L300 200 L570 350 L300 500 Z" fill="none" stroke="#F59E0B" stroke-opacity="0.1" stroke-width="1.5"/>
  <path d="M30 450 L300 300 L570 450 L300 600 Z" fill="none" stroke="#F59E0B" stroke-opacity="0.1" stroke-width="1.5"/>

  <!-- Top Event Eyebrow -->
  <g transform="translate(60, 80)">
    <rect x="0" y="0" width="170" height="30" rx="6" fill="#F59E0B" fill-opacity="0.15" stroke="#F59E0B"/>
    <text x="85" y="20" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700" letter-spacing="1" text-anchor="middle">MONTHLY MEETUP // 08</text>
    
    <text x="480" y="20" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" text-anchor="end">RWANDA IT ECOSYSTEM</text>
  </g>

  <!-- Headline -->
  <g transform="translate(60, 180)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" letter-spacing="-2">NOCTURNAL</text>
    <text x="0" y="60" fill="url(#amber_glow)" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" letter-spacing="-2">SYSTEMS</text>
    <text x="0" y="120" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="52" font-weight="900" letter-spacing="-2">ARCHITECTURE</text>
  </g>

  <text x="60" y="340" fill="#D1D5DB" font-family="'Inter', sans-serif" font-size="16">An evening of deep-dive talks on memory profiling, LAN protocols &amp; distributed state.</text>

  <!-- Event Specs Card -->
  <g transform="translate(60, 380)">
    <rect x="0" y="0" width="480" height="150" rx="14" fill="#140E07" stroke="#3D2914" stroke-width="1.5"/>
    
    <!-- Time Column -->
    <g transform="translate(30, 35)">
      <text x="0" y="0" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">DATE &amp; SCHEDULE</text>
      <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Friday, Nov 27</text>
      <text x="0" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">18:30 — 21:30 CAT</text>
    </g>

    <!-- Venue Column -->
    <g transform="translate(250, 35)">
      <text x="0" y="0" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">VENUE / COORDINATES</text>
      <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">Impact Hub Kigali</text>
      <text x="0" y="55" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Rooftop Lounge • Kiyovu</text>
    </g>

    <line x1="30" y1="110" x2="450" y2="110" stroke="#2B1D0E"/>
    <text x="30" y="132" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="11">PERKS: CRAFT COFFEE • PIZZA • OPEN REPO LIGHTNING ROUNDS</text>
  </g>

  <!-- Talk Lineup Highlights -->
  <g transform="translate(60, 560)">
    <text x="0" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">FEATURED TALKS</text>
    
    <text x="0" y="55" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">1. Profiling Java 21 Virtual Threads at 50k Concurrency</text>
    <text x="0" y="75" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">By Meekness Bonheur (Full-Stack Systems Engineer)</text>

    <text x="0" y="110" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">2. Autonomous LAN Sync Without Cloud Relays</text>
    <text x="0" y="130" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">By Arc Lab Protocol Team</text>
  </g>

  <!-- Footer -->
  <text x="300" y="745" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">A3 POSTER SPEC // 297 x 420 mm // 300 DPI // 250gsm SILK FINISH</text>
</svg>
