<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1422" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_r2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050B08"/>
      <stop offset="45%" stop-color="#0B1A14"/>
      <stop offset="100%" stop-color="#040906"/>
    </linearGradient>
    <linearGradient id="emerald_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="stand_metal_dark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#64748B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
  </defs>

  <!-- Top Clamp / Aluminum Hanging Bar -->
  <rect x="60" y="20" width="680" height="18" rx="4" fill="url(#stand_metal_dark)"/>

  <!-- Main Banner Canvas -->
  <rect x="70" y="38" width="660" height="1320" rx="2" fill="url(#bg_r2)"/>

  <!-- Circuit & Grid Lines -->
  <path d="M70 240 L280 240 L340 300 L730 300" stroke="#10B981" stroke-opacity="0.25" stroke-width="2" fill="none"/>
  <circle cx="340" cy="300" r="5" fill="#10B981"/>
  <path d="M730 840 L500 840 L440 900 L70 900" stroke="#10B981" stroke-opacity="0.2" stroke-width="2" fill="none"/>
  <circle cx="440" cy="900" r="5" fill="#34D399"/>

  <!-- Top Badge -->
  <rect x="120" y="80" width="230" height="34" rx="6" fill="#10B981" fill-opacity="0.12" stroke="#10B981" stroke-width="1.2"/>
  <text x="235" y="102" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">&lt;DEV CHALLENGE 2026 /&gt;</text>

  <!-- Headline -->
  <text x="120" y="220" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="60" font-weight="800" letter-spacing="-1">RWANDA</text>
  <text x="120" y="285" fill="url(#emerald_glow)" font-family="'Space Grotesk', sans-serif" font-size="60" font-weight="800" letter-spacing="-1">CODE CAMP &amp;</text>
  <text x="120" y="350" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="60" font-weight="800" letter-spacing="-1">HACKATHON</text>

  <text x="120" y="410" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="20">48-Hour Sprint: High-Concurrency Protocols &amp; Local Intelligence</text>

  <!-- Central Visual Matrix Code Terminal -->
  <g transform="translate(120, 480)">
    <rect x="0" y="0" width="560" height="340" rx="14" fill="#030806" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Terminal header -->
    <rect x="0" y="0" width="560" height="38" rx="14" fill="#0A1811"/>
    <circle cx="25" cy="19" r="6" fill="#EF4444"/>
    <circle cx="45" cy="19" r="6" fill="#F59E0B"/>
    <circle cx="65" cy="19" r="6" fill="#10B981"/>
    <text x="100" y="24" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="12">system_init_daemon.rs</text>

    <!-- Code Block Lines -->
    <text x="30" y="80" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="14">pub async fn deploy_cluster(nodes: u32) -&gt; Result&lt;()&gt; {</text>
    <text x="60" y="115" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="14">let consensus = RaftEngine::bootstrap(nodes).await?;</text>
    <text x="60" y="150" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="14">info!("Kigali Mesh Network Online: latency &lt; 2ms");</text>
    <text x="60" y="185" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14">while let Some(packet) = consensus.listen().next() {</text>
    <text x="90" y="220" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="14">packet.validate_signatures()?;</text>
    <text x="60" y="255" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="14">}</text>
    <text x="30" y="290" fill="#A7F3D0" font-family="'JetBrains Mono', monospace" font-size="14">}</text>
  </g>

  <!-- Prize Pool Banner -->
  <g transform="translate(120, 860)">
    <rect x="0" y="0" width="560" height="120" rx="12" fill="#0B1A14" stroke="#10B981" stroke-width="1.5"/>
    <text x="30" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="1">TOTAL PRIZE POOL</text>
    <text x="30" y="90" fill="#10B981" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="800">15,000,000 RWF</text>
    
    <text x="360" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">TEAMS COMPETING</text>
    <text x="360" y="90" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="40" font-weight="800">60+ SQUADS</text>
  </g>

  <!-- Track Highlights -->
  <g transform="translate(120, 1020)">
    <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">COMPETITION TRACKS</text>
    <rect x="0" y="50" width="170" height="40" rx="8" fill="#14261D" stroke="#1E3A2B"/>
    <text x="85" y="75" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Distributed Systems</text>

    <rect x="190" y="50" width="170" height="40" rx="8" fill="#14261D" stroke="#1E3A2B"/>
    <text x="275" y="75" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Applied Edge AI</text>

    <rect x="380" y="50" width="180" height="40" rx="8" fill="#14261D" stroke="#1E3A2B"/>
    <text x="470" y="75" fill="#A7F3D0" font-family="'Inter', sans-serif" font-size="13" font-weight="600" text-anchor="middle">FinTech Interop</text>
  </g>

  <!-- Footer Specs & Stand -->
  <text x="120" y="1190" fill="#6EE7B7" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">REGISTER YOUR TEAM</text>
  <text x="120" y="1220" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="15">hackathon.umurava.africa</text>
  <text x="120" y="1255" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">PRINT FORMAT: 850x2000mm // CMYK 300 DPI // OUTDOOR VINYL</text>

  <!-- Bottom Rollup Standee Base -->
  <rect x="50" y="1358" width="700" height="36" rx="6" fill="url(#stand_metal_dark)"/>
  <rect x="65" y="1394" width="200" height="12" rx="3" fill="#040906"/>
  <rect x="535" y="1394" width="200" height="12" rx="3" fill="#040906"/>
</svg>
