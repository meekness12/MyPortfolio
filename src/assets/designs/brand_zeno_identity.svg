<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="brand_board_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0C14"/>
      <stop offset="50%" stop-color="#121624"/>
      <stop offset="100%" stop-color="#07090F"/>
    </linearGradient>
  </defs>

  <!-- Background Board -->
  <rect x="0" y="0" width="800" height="500" fill="url(#brand_board_bg)"/>

  <!-- Top Title Strip -->
  <g transform="translate(50, 45)">
    <text x="0" y="0" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="3">BRAND SYSTEM GUIDELINES</text>
    <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800">Zeno Cloud Protocol</text>
    <text x="700" y="20" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">VERSION 2.4 // 2026</text>
  </g>

  <!-- Section 1: Logo Construction Grid (Left Box) -->
  <g transform="translate(50, 105)">
    <rect x="0" y="0" width="330" height="230" rx="14" fill="#0E121E" stroke="#1E263B" stroke-width="1.5"/>
    <!-- Construction Grid Lines -->
    <line x1="20" y1="115" x2="310" y2="115" stroke="#3B82F6" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <line x1="165" y1="20" x2="165" y2="210" stroke="#3B82F6" stroke-opacity="0.3" stroke-dasharray="3 3"/>
    <circle cx="165" cy="115" r="70" fill="none" stroke="#3B82F6" stroke-opacity="0.25" stroke-dasharray="4 4"/>
    <circle cx="165" cy="115" r="45" fill="none" stroke="#06B6D4" stroke-opacity="0.3"/>

    <!-- Geometric Zeno Monogram Mark -->
    <path d="M125 80 L205 80 L145 150 L205 150" fill="none" stroke="#3B82F6" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="125" cy="80" r="5" fill="#06B6D4"/>
    <circle cx="205" cy="150" r="5" fill="#06B6D4"/>

    <text x="20" y="210" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">01 // GEOMETRIC MONOGRAM</text>
  </g>

  <!-- Section 2: Color Palette Swatches (Right Box) -->
  <g transform="translate(410, 105)">
    <rect x="0" y="0" width="340" height="230" rx="14" fill="#0E121E" stroke="#1E263B" stroke-width="1.5"/>
    <text x="20" y="30" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">02 // CHROMATIC TOKENS</text>

    <!-- Swatch 1: Obsidian -->
    <rect x="20" y="50" width="60" height="90" rx="8" fill="#0A0C10" stroke="#334155"/>
    <text x="20" y="155" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">#0A0C10</text>
    <text x="20" y="170" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Obsidian</text>

    <!-- Swatch 2: Electric Blue -->
    <rect x="100" y="50" width="60" height="90" rx="8" fill="#3B82F6"/>
    <text x="100" y="155" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">#3B82F6</text>
    <text x="100" y="170" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Core Blue</text>

    <!-- Swatch 3: Cyan -->
    <rect x="180" y="50" width="60" height="90" rx="8" fill="#06B6D4"/>
    <text x="180" y="155" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">#06B6D4</text>
    <text x="180" y="170" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">High Cyan</text>

    <!-- Swatch 4: Emerald -->
    <rect x="260" y="50" width="60" height="90" rx="8" fill="#10B981"/>
    <text x="260" y="155" fill="#E2E8F0" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="700">#10B981</text>
    <text x="260" y="170" fill="#64748B" font-family="'Inter', sans-serif" font-size="10">Success</text>
  </g>

  <!-- Section 3: Typography Specimen (Bottom Bar) -->
  <g transform="translate(50, 360)">
    <rect x="0" y="0" width="700" height="100" rx="14" fill="#0E121E" stroke="#1E263B" stroke-width="1.5"/>
    
    <g transform="translate(30, 35)">
      <text x="0" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">HEADLINE TYPEFACE</text>
      <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="800">Space Grotesk (700 / 800)</text>
    </g>

    <g transform="translate(370, 35)">
      <text x="0" y="0" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11">BODY &amp; CODE SYSTEM</text>
      <text x="0" y="30" fill="#60A5FA" font-family="'Inter', sans-serif" font-size="18" font-weight="500">Inter &amp; JetBrains Mono</text>
    </g>
  </g>
</svg>
