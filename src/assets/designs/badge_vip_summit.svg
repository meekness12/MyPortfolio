<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="badge_card_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724"/>
      <stop offset="50%" stop-color="#0B0D14"/>
      <stop offset="100%" stop-color="#181C2E"/>
    </linearGradient>
    <linearGradient id="holo_foil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="30%" stop-color="#3B82F6"/>
      <stop offset="60%" stop-color="#EC4899"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="gold_metallic" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
  </defs>

  <!-- Lanyard Strap Mockup Peeking Out at Top -->
  <path d="M260 0 L260 70 L340 70 L340 0 Z" fill="#1E293B"/>
  <rect x="250" y="60" width="100" height="15" rx="3" fill="#64748B"/>
  <!-- Lanyard Clip Hook -->
  <path d="M285 75 C285 95 315 95 315 75 Z" fill="none" stroke="#94A3B8" stroke-width="6"/>

  <!-- Main Acrylic Credential Badge Body (CR80/A6 Vertical) -->
  <rect x="60" y="80" width="480" height="680" rx="28" fill="url(#badge_card_bg)" stroke="#2A334E" stroke-width="2"/>
  
  <!-- Lanyard Slot Punch Hole -->
  <rect x="240" y="105" width="120" height="18" rx="9" fill="#0A0C10" stroke="#334155" stroke-width="2"/>

  <!-- Top Conference Name -->
  <text x="300" y="170" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="700" letter-spacing="4" text-anchor="middle">GLOBAL TECH SUMMIT 2026</text>
  <text x="300" y="195" fill="#64748B" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">OCTOBER 24-26 • KIGALI CONVENTION CENTRE</text>

  <!-- Holographic VIP Strip -->
  <rect x="90" y="220" width="420" height="70" rx="14" fill="url(#holo_foil)" opacity="0.95"/>
  <text x="300" y="265" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="34" font-weight="900" letter-spacing="6" text-anchor="middle">VIP ALL ACCESS</text>

  <!-- Attendee Photo / Avatar Space -->
  <g transform="translate(190, 320)">
    <rect x="0" y="0" width="220" height="220" rx="18" fill="#101524" stroke="url(#gold_metallic)" stroke-width="2.5"/>
    <!-- Stylized Avatar Silhouette with Geometric Matrix Background -->
    <circle cx="110" cy="80" r="42" fill="#3B82F6" fill-opacity="0.2" stroke="#60A5FA" stroke-width="2"/>
    <path d="M50 190 C50 140 170 140 170 190 Z" fill="#3B82F6" fill-opacity="0.25" stroke="#60A5FA" stroke-width="2"/>
    <!-- Holographic security seal on photo corner -->
    <circle cx="190" cy="190" r="22" fill="url(#holo_foil)" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="190" y="194" fill="#FFFFFF" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" text-anchor="middle">VERIFIED</text>
  </g>

  <!-- Attendee Credentials -->
  <text x="300" y="585" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="28" font-weight="800" text-anchor="middle">MEEKNESS BONHEUR</text>
  <text x="300" y="615" fill="url(#gold_metallic)" font-family="'Inter', sans-serif" font-size="15" font-weight="600" text-anchor="middle">Head of Systems &amp; UI Architecture</text>
  <text x="300" y="638" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="middle">DELEGATE ID: RW-2026-VIP-0842</text>

  <!-- Barcode & Access Zones Footer -->
  <line x1="90" y1="660" x2="510" y2="660" stroke="#2A334E" stroke-width="1.5"/>

  <!-- Barcode Lines -->
  <g transform="translate(90, 680)">
    <rect x="0" y="0" width="4" height="40" fill="#FFFFFF"/>
    <rect x="8" y="0" width="8" height="40" fill="#FFFFFF"/>
    <rect x="22" y="0" width="2" height="40" fill="#FFFFFF"/>
    <rect x="30" y="0" width="6" height="40" fill="#FFFFFF"/>
    <rect x="42" y="0" width="10" height="40" fill="#FFFFFF"/>
    <rect x="58" y="0" width="4" height="40" fill="#FFFFFF"/>
    <rect x="68" y="0" width="6" height="40" fill="#FFFFFF"/>
    <rect x="80" y="0" width="2" height="40" fill="#FFFFFF"/>
    <rect x="90" y="0" width="8" height="40" fill="#FFFFFF"/>
    <rect x="104" y="0" width="4" height="40" fill="#FFFFFF"/>
    <rect x="114" y="0" width="6" height="40" fill="#FFFFFF"/>
    <rect x="126" y="0" width="2" height="40" fill="#FFFFFF"/>
    <rect x="136" y="0" width="8" height="40" fill="#FFFFFF"/>
    <rect x="150" y="0" width="6" height="40" fill="#FFFFFF"/>
    <rect x="162" y="0" width="4" height="40" fill="#FFFFFF"/>
    <rect x="174" y="0" width="8" height="40" fill="#FFFFFF"/>
    <rect x="188" y="0" width="2" height="40" fill="#FFFFFF"/>
    <rect x="196" y="0" width="4" height="40" fill="#FFFFFF"/>
  </g>

  <!-- Zone Badges -->
  <g transform="translate(320, 685)">
    <rect x="0" y="0" width="40" height="30" rx="6" fill="#10B981" fill-opacity="0.2" stroke="#10B981"/>
    <text x="20" y="20" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">Z1</text>

    <rect x="50" y="0" width="40" height="30" rx="6" fill="#3B82F6" fill-opacity="0.2" stroke="#3B82F6"/>
    <text x="70" y="20" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">Z2</text>

    <rect x="100" y="0" width="40" height="30" rx="6" fill="#F59E0B" fill-opacity="0.2" stroke="#F59E0B"/>
    <text x="120" y="20" fill="#F59E0B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">VIP</text>

    <rect x="150" y="0" width="40" height="30" rx="6" fill="#EC4899" fill-opacity="0.2" stroke="#EC4899"/>
    <text x="170" y="20" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" text-anchor="middle">EXP</text>
  </g>
</svg>
