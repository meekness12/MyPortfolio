<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1422" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_r3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070D1E"/>
      <stop offset="60%" stop-color="#0E1938"/>
      <stop offset="100%" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="gold_grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#FCD34D"/>
    </linearGradient>
    <linearGradient id="silver_bar" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8"/>
      <stop offset="50%" stop-color="#CBD5E1"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
  </defs>

  <!-- Top Clamp -->
  <rect x="60" y="20" width="680" height="18" rx="4" fill="url(#silver_bar)"/>

  <!-- Main Banner Canvas -->
  <rect x="70" y="38" width="660" height="1320" rx="2" fill="url(#bg_r3)"/>

  <!-- Architectural Gold Accent Bars -->
  <rect x="120" y="70" width="6" height="40" fill="url(#gold_grad)"/>
  <text x="140" y="95" fill="url(#gold_grad)" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="3">EXECUTIVE FORUM 2026</text>

  <!-- Main Headline Block -->
  <text x="120" y="220" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">FINTECH</text>
  <text x="120" y="290" fill="url(#gold_grad)" font-family="'Space Grotesk', sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">EAST AFRICA</text>
  <text x="120" y="360" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5">SUMMIT</text>

  <text x="120" y="420" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="20">Cross-Border Settlements, Real-Time Liquidity &amp; CBDC Standards</text>

  <!-- Financial Telemetry Wave / Graph Motif -->
  <g transform="translate(120, 500)">
    <rect x="0" y="0" width="560" height="320" rx="16" fill="#131F40" stroke="#1E3264" stroke-width="1.5"/>
    <!-- Grid -->
    <line x1="0" y1="80" x2="560" y2="80" stroke="#1E3264" stroke-dasharray="4 4"/>
    <line x1="0" y1="160" x2="560" y2="160" stroke="#1E3264" stroke-dasharray="4 4"/>
    <line x1="0" y1="240" x2="560" y2="240" stroke="#1E3264" stroke-dasharray="4 4"/>

    <!-- Ascending Financial Growth Curves -->
    <path d="M40 260 Q 140 220, 240 180 T 420 100 T 520 40" fill="none" stroke="#F59E0B" stroke-width="4"/>
    <path d="M40 280 Q 160 250, 280 210 T 440 140 T 520 80" fill="none" stroke="#3B82F6" stroke-width="2.5" stroke-opacity="0.6"/>

    <circle cx="520" cy="40" r="7" fill="#FCD34D"/>
    <text x="440" y="30" fill="#FCD34D" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700">+342.8% VOL</text>

    <!-- Metrics inside graph card -->
    <rect x="30" y="20" width="160" height="44" rx="8" fill="#0A1128" stroke="#F59E0B" stroke-opacity="0.3"/>
    <text x="45" y="47" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="13">Processed Volume: <tspan fill="#F59E0B" font-weight="700">$4.2B</tspan></text>
  </g>

  <!-- Pillars of Discussion -->
  <g transform="translate(120, 880)">
    <rect x="0" y="0" width="265" height="140" rx="12" fill="#111B38" stroke="#1E3264"/>
    <text x="25" y="40" fill="url(#gold_grad)" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">PAN-AFRICAN RAILS</text>
    <text x="25" y="70" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13" width="200">Instant cross-currency settlement interoperability across EAC &amp; COMESA.</text>
    
    <rect x="295" y="0" width="265" height="140" rx="12" fill="#111B38" stroke="#1E3264"/>
    <text x="320" y="40" fill="url(#gold_grad)" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="700">REGULATORY SANDBOX</text>
    <text x="320" y="70" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="13">Direct interface with Central Bank governors and policy makers.</text>
  </g>

  <!-- Venue / Date -->
  <g transform="translate(120, 1070)">
    <text x="0" y="30" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="24" font-weight="700">NOVEMBER 18, 2026</text>
    <text x="0" y="60" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="16">Kigali Marriott Hotel &amp; Conference Center</text>
    <text x="0" y="100" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">STAND SPECIFICATION: 850x2000mm // CMYK 300 DPI // MATTE LAM</text>
  </g>

  <!-- Aluminum Standee Base -->
  <rect x="50" y="1358" width="700" height="36" rx="6" fill="url(#silver_bar)"/>
  <rect x="65" y="1394" width="200" height="12" rx="3" fill="#050814"/>
  <rect x="535" y="1394" width="200" height="12" rx="3" fill="#050814"/>
</svg>
