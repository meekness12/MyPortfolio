<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="stationery_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0D14"/>
      <stop offset="50%" stop-color="#141824"/>
      <stop offset="100%" stop-color="#08090E"/>
    </linearGradient>
    <filter id="sheet_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Studio Surface -->
  <rect x="0" y="0" width="800" height="500" fill="url(#stationery_bg)"/>

  <!-- Left: A4 Corporate Letterhead Mockup -->
  <g transform="translate(60, 45)" filter="url(#sheet_shadow)">
    <!-- Letterhead Paper -->
    <rect x="0" y="0" width="280" height="390" rx="4" fill="#FFFFFF"/>

    <!-- Letterhead Header -->
    <g transform="translate(25, 25)">
      <!-- Mini Monogram -->
      <path d="M0 0 L18 0 L6 18 L18 18" fill="none" stroke="#3B82F6" stroke-width="3"/>
      <text x="26" y="15" fill="#0F172A" font-family="'Space Grotesk', sans-serif" font-size="14" font-weight="800">ZENO SYSTEMS</text>
      <text x="26" y="27" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="7">CLOUD PROTOCOLS LAB</text>
    </g>
    <line x1="25" y1="65" x2="255" y2="65" stroke="#E2E8F0" stroke-width="1"/>

    <!-- Simulated Body Lines -->
    <g transform="translate(25, 90)">
      <rect x="0" y="0" width="70" height="6" rx="2" fill="#94A3B8"/>
      <rect x="0" y="18" width="230" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="0" y="30" width="230" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="0" y="42" width="210" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="0" y="54" width="230" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="0" y="66" width="180" height="4" rx="2" fill="#E2E8F0"/>

      <rect x="0" y="90" width="230" height="4" rx="2" fill="#CBD5E1"/>
      <rect x="0" y="102" width="220" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="0" y="114" width="230" height="4" rx="2" fill="#E2E8F0"/>
      <rect x="0" y="126" width="160" height="4" rx="2" fill="#E2E8F0"/>

      <!-- Signature -->
      <path d="M0 170 Q 20 150, 40 175 T 80 160 T 110 170" fill="none" stroke="#3B82F6" stroke-width="1.8"/>
      <text x="0" y="195" fill="#0F172A" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">Meekness Bonheur</text>
      <text x="0" y="208" fill="#64748B" font-family="'Inter', sans-serif" font-size="8">Lead Architect, Zeno</text>
    </g>

    <!-- Letterhead Footer -->
    <line x1="25" y1="350" x2="255" y2="350" stroke="#E2E8F0" stroke-width="1"/>
    <text x="140" y="368" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="7" text-anchor="middle">KIGALI, RWANDA // HELLO@ZENO.CLOUD // WWW.ZENO.CLOUD</text>
  </g>

  <!-- Right: Envelope Mockup (DL Size) -->
  <g transform="translate(390, 80)" filter="url(#sheet_shadow)">
    <!-- Envelope Body -->
    <rect x="0" y="0" width="350" height="180" rx="6" fill="#141824" stroke="#252C3E"/>
    <!-- Triangular Flap Contour Line -->
    <path d="M0 0 L175 100 L350 0" stroke="#333E56" stroke-width="1.5" fill="none"/>

    <!-- Foil Monogram on Envelope Flap -->
    <circle cx="175" cy="100" r="18" fill="#3B82F6" stroke="#60A5FA" stroke-width="1.5"/>
    <path d="M168 93 L182 93 L171 107 L182 107" fill="none" stroke="#FFFFFF" stroke-width="2.2"/>

    <!-- Return Address on Bottom Left -->
    <text x="25" y="145" fill="#94A3B8" font-family="'Space Grotesk', sans-serif" font-size="10" font-weight="700">ZENO CLOUD PROTOCOLS</text>
    <text x="25" y="160" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="8">KN 5 RD, KIGALI, RWANDA</text>
  </g>

  <!-- Wax Seal / Embossed Stamp Mockup (Bottom Right) -->
  <g transform="translate(565, 330)">
    <circle cx="50" cy="50" r="46" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="50" cy="50" r="38" fill="#0A0C14" stroke="#06B6D4" stroke-width="1.5"/>
    <path d="M38 38 L62 38 L44 62 L62 62" fill="none" stroke="#3B82F6" stroke-width="4" stroke-linecap="round"/>
    <text x="50" y="98" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle">OFFICIAL PROTOCOL SEAL</text>
  </g>

  <!-- Bottom Spec Label -->
  <text x="400" y="465" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SUITE SPEC: A4 120gsm UNCOATED LETTERHEAD // DL FLAP ENVELOPE // METALLIC SEAL</text>
</svg>
