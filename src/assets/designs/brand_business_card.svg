<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="studio_bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F1118"/>
      <stop offset="50%" stop-color="#181B26"/>
      <stop offset="100%" stop-color="#090A0F"/>
    </linearGradient>
    <linearGradient id="card_front_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2030"/>
      <stop offset="100%" stop-color="#0E1018"/>
    </linearGradient>
    <linearGradient id="copper_foil" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D97706"/>
      <stop offset="30%" stop-color="#FCD34D"/>
      <stop offset="70%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="card_shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Studio Surface Canvas -->
  <rect x="0" y="0" width="800" height="500" fill="url(#studio_bg)"/>

  <!-- Subtle Studio Light Spot -->
  <circle cx="400" cy="250" r="300" fill="#3B82F6" fill-opacity="0.05"/>

  <!-- Card Back (Tilted Left Card) -->
  <g transform="translate(100, 100) rotate(-6)" filter="url(#card_shadow)">
    <!-- Electric Cyan Painted Edge Effect -->
    <rect x="-2" y="-2" width="314" height="194" rx="14" fill="#06B6D4"/>
    <!-- Card Body -->
    <rect x="0" y="0" width="310" height="190" rx="12" fill="url(#card_front_grad)"/>

    <!-- NFC Wave Icon -->
    <g transform="translate(30, 30)">
      <circle cx="15" cy="15" r="14" fill="#0A0C14" stroke="url(#copper_foil)" stroke-width="1.2"/>
      <path d="M12 21 C15 18 15 12 12 9 M15 24 C20 19 20 11 15 6" stroke="url(#copper_foil)" stroke-width="1.5" fill="none"/>
    </g>

    <!-- Centered Copper Foil Monogram -->
    <g transform="translate(155, 95)">
      <circle cx="0" cy="0" r="34" fill="#0A0C14" stroke="url(#copper_foil)" stroke-width="1.5"/>
      <path d="M-14 -12 L14 -12 L-6 12 L14 12" fill="none" stroke="url(#copper_foil)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <text x="155" y="160" fill="url(#copper_foil)" font-family="'Space Grotesk', sans-serif" font-size="12" font-weight="700" letter-spacing="3" text-anchor="middle">ZENO CLOUD</text>
  </g>

  <!-- Card Front (Overlapping Right Card) -->
  <g transform="translate(380, 160) rotate(4)" filter="url(#card_shadow)">
    <!-- Electric Cyan Painted Edge -->
    <rect x="-2" y="-2" width="324" height="194" rx="14" fill="#06B6D4"/>
    <!-- Card Body -->
    <rect x="0" y="0" width="320" height="190" rx="12" fill="#0A0D14"/>

    <!-- Details Inside Front Card -->
    <g transform="translate(35, 40)">
      <!-- Name in Copper Foil -->
      <text x="0" y="0" fill="url(#copper_foil)" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="800">MEEKNESS BONHEUR</text>
      <text x="0" y="22" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="11" font-weight="500">Lead Systems &amp; UI Architect</text>
      
      <line x1="0" y1="36" x2="250" y2="36" stroke="#1E293B" stroke-width="1"/>

      <text x="0" y="60" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">+250 780 000 000</text>
      <text x="0" y="78" fill="#CBD5E1" font-family="'JetBrains Mono', monospace" font-size="10">meeknessbon@gmail.com</text>
      <text x="0" y="96" fill="#60A5FA" font-family="'JetBrains Mono', monospace" font-size="10">meekness.dev // Kigali, RW</text>

      <!-- Mini QR code for vCard -->
      <g transform="translate(200, 50)">
        <rect x="0" y="0" width="50" height="50" rx="6" fill="#FFFFFF"/>
        <rect x="5" y="5" width="14" height="14" fill="#0A0D14"/>
        <rect x="31" y="5" width="14" height="14" fill="#0A0D14"/>
        <rect x="5" y="31" width="14" height="14" fill="#0A0D14"/>
        <rect x="22" y="22" width="8" height="8" fill="#06B6D4"/>
      </g>
    </g>
  </g>

  <!-- Technical Spec Caption Footer -->
  <text x="400" y="465" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">SPEC: 85 x 55 mm // 600gsm COTTON DUPLEX // METALLIC COPPER FOIL &amp; CYAN EDGE PAINT</text>
</svg>
