<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="badge_spk_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#04120C"/>
      <stop offset="60%" stop-color="#0B2317"/>
      <stop offset="100%" stop-color="#020905"/>
    </linearGradient>
    <linearGradient id="emerald_bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>

  <!-- Lanyard Top Webbing -->
  <path d="M260 0 L260 65 L340 65 L340 0 Z" fill="#047857"/>
  <rect x="250" y="55" width="100" height="15" rx="3" fill="#10B981"/>
  <path d="M285 70 C285 90 315 90 315 70 Z" fill="none" stroke="#D1FAE5" stroke-width="5"/>

  <!-- Main Card Body -->
  <rect x="60" y="80" width="480" height="680" rx="26" fill="url(#badge_spk_bg)" stroke="#134E35" stroke-width="2"/>
  
  <!-- Lanyard Slot -->
  <rect x="240" y="105" width="120" height="18" rx="9" fill="#020905" stroke="#10B981" stroke-width="1.5"/>

  <!-- Organization -->
  <text x="300" y="165" fill="#34D399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="3" text-anchor="middle">UMURAVA AI HACKATHON</text>
  <text x="300" y="190" fill="#6EE7B7" font-family="'Inter', sans-serif" font-size="12" text-anchor="middle">ANNUAL DEVELOPER CHAMPIONSHIP</text>

  <!-- Giant Speaker Badge -->
  <rect x="90" y="215" width="420" height="75" rx="14" fill="url(#emerald_bar)"/>
  <text x="300" y="265" fill="#022C1A" font-family="'Space Grotesk', sans-serif" font-size="38" font-weight="900" letter-spacing="6" text-anchor="middle">KEYNOTE SPEAKER</text>

  <!-- Speaker Details Card -->
  <g transform="translate(100, 320)">
    <rect x="0" y="0" width="400" height="230" rx="16" fill="#061A10" stroke="#10B981" stroke-opacity="0.3" stroke-width="1.5"/>
    
    <text x="30" y="45" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">PRESENTER NAME</text>
    <text x="30" y="85" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="32" font-weight="800">MEEKNESS BONHEUR</text>
    
    <text x="30" y="120" fill="#34D399" font-family="'Inter', sans-serif" font-size="16" font-weight="600">Lead AI Systems Engineer // Team Arc Lab</text>

    <!-- Keynote Topic Box -->
    <rect x="30" y="145" width="340" height="60" rx="10" fill="#020C07" stroke="#059669" stroke-width="1"/>
    <text x="45" y="170" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">KEYNOTE STAGE • 14:00 CAT</text>
    <text x="45" y="192" fill="#E2E8F0" font-family="'Inter', sans-serif" font-size="13" font-weight="500">"Building Zero-Data-Entry Systems with Multimodal OCR"</text>
  </g>

  <!-- Security Access clearance block -->
  <g transform="translate(100, 580)">
    <text x="0" y="25" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="12">CLEARANCE LEVEL: <tspan fill="#34D399" font-weight="700">STAGE + GREEN ROOM + BACKSTAGE</tspan></text>
    
    <!-- NFC wireless icon -->
    <circle cx="360" cy="20" r="18" fill="#10B981" fill-opacity="0.15" stroke="#10B981"/>
    <path d="M354 20 C354 15 366 15 366 20 M350 20 C350 11 370 11 370 20" stroke="#34D399" stroke-width="2" fill="none"/>
  </g>

  <!-- Bottom QR code & barcode -->
  <line x1="100" y1="630" x2="500" y2="630" stroke="#134E35" stroke-width="1.5"/>

  <!-- Barcode -->
  <g transform="translate(100, 655)">
    <rect x="0" y="0" width="4" height="45" fill="#34D399"/>
    <rect x="8" y="0" width="10" height="45" fill="#34D399"/>
    <rect x="24" y="0" width="3" height="45" fill="#34D399"/>
    <rect x="32" y="0" width="8" height="45" fill="#34D399"/>
    <rect x="46" y="0" width="4" height="45" fill="#34D399"/>
    <rect x="56" y="0" width="12" height="45" fill="#34D399"/>
    <rect x="74" y="0" width="6" height="45" fill="#34D399"/>
    <rect x="86" y="0" width="2" height="45" fill="#34D399"/>
    <rect x="94" y="0" width="10" height="45" fill="#34D399"/>
    <rect x="110" y="0" width="4" height="45" fill="#34D399"/>
    <rect x="120" y="0" width="8" height="45" fill="#34D399"/>
    <rect x="134" y="0" width="2" height="45" fill="#34D399"/>
    <rect x="142" y="0" width="10" height="45" fill="#34D399"/>
    <rect x="158" y="0" width="4" height="45" fill="#34D399"/>
    <rect x="168" y="0" width="8" height="45" fill="#34D399"/>
    <rect x="182" y="0" width="14" height="45" fill="#34D399"/>
    <rect x="202" y="0" width="4" height="45" fill="#34D399"/>
  </g>

  <text x="340" y="680" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="700">PASS #SPK-019</text>
  <text x="340" y="700" fill="#6EE7B7" font-family="'JetBrains Mono', monospace" font-size="11">ACCESS CODE: 9812-7491-03</text>
</svg>
