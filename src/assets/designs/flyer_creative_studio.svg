<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" width="100%" height="100%">
  <defs>
    <linearGradient id="flyer3_bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0E1017"/>
      <stop offset="50%" stop-color="#161A26"/>
      <stop offset="100%" stop-color="#0A0C12"/>
    </linearGradient>
  </defs>

  <!-- Sheet Canvas -->
  <rect x="0" y="0" width="600" height="800" fill="#040508"/>

  <!-- Printer Alignment Guides -->
  <line x1="30" y1="20" x2="30" y2="40" stroke="#334155" stroke-width="1"/>
  <line x1="20" y1="30" x2="40" y2="30" stroke="#334155" stroke-width="1"/>
  <line x1="570" y1="20" x2="570" y2="40" stroke="#334155" stroke-width="1"/>
  <line x1="560" y1="30" x2="580" y2="30" stroke="#334155" stroke-width="1"/>

  <!-- Flyer Body -->
  <rect x="30" y="30" width="540" height="740" fill="url(#flyer3_bg)" stroke="#1F2438" stroke-width="1.5"/>

  <!-- Grid Blueprint Accents -->
  <line x1="80" y1="30" x2="80" y2="770" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="30" x2="520" y2="770" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="30" y1="130" x2="570" y2="130" stroke="#1E293B" stroke-width="1"/>

  <!-- Top Strip -->
  <text x="80" y="80" fill="#94A3B8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">ADVANCED CRAFT // 2026</text>
  <text x="80" y="105" fill="#3B82F6" font-family="'Space Grotesk', sans-serif" font-size="18" font-weight="800">DESIGN ENGINEERING LAB</text>

  <text x="520" y="100" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" text-anchor="end">EDITION: PRINT-03</text>

  <!-- Main Headline with Typographic Rigor -->
  <g transform="translate(80, 200)">
    <text x="0" y="0" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">TACTILE MOTION</text>
    <text x="0" y="55" fill="#3B82F6" font-family="'Space Grotesk', sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">&amp; DESIGN TOKENS</text>
  </g>

  <text x="80" y="290" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="16">The compound effect of unseen details: spring physics, optical alignments &amp; token systems.</text>

  <!-- Principles Cards Grid -->
  <g transform="translate(80, 335)">
    <!-- Principle 1 -->
    <rect x="0" y="0" width="210" height="120" rx="10" fill="#111420" stroke="#1E2438"/>
    <text x="20" y="35" fill="#3B82F6" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">01 // LAYOUT</text>
    <text x="20" y="65" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Layout Over Crutches</text>
    <text x="20" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Eliminate helper labels by fixing spatial hierarchy.</text>

    <!-- Principle 2 -->
    <rect x="230" y="0" width="210" height="120" rx="10" fill="#111420" stroke="#1E2438"/>
    <text x="250" y="35" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">02 // MOTION</text>
    <text x="250" y="65" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Physical Spring Feel</text>
    <text x="250" y="90" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Interruptible velocity curves for natural response.</text>

    <!-- Principle 3 -->
    <rect x="0" y="135" width="210" height="120" rx="10" fill="#111420" stroke="#1E2438"/>
    <text x="20" y="170" fill="#10B981" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">03 // TYPOGRAPHY</text>
    <text x="20" y="200" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Optical Alignment</text>
    <text x="20" y="225" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Optical center vs mathematical bounding box.</text>

    <!-- Principle 4 -->
    <rect x="230" y="135" width="210" height="120" rx="10" fill="#111420" stroke="#1E2438"/>
    <text x="250" y="170" fill="#EC4899" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">04 // TOKENS</text>
    <text x="250" y="200" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="700">Concentric Radii</text>
    <text x="250" y="225" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="12">Outer radius = inner radius + padding formula.</text>
  </g>

  <!-- Curve Diagram Visual -->
  <g transform="translate(80, 620)">
    <rect x="0" y="0" width="440" height="80" rx="10" fill="#0D101C" stroke="#1E2438"/>
    <path d="M30 60 C80 60, 100 15, 200 15 L410 15" fill="none" stroke="#3B82F6" stroke-width="2.5"/>
    <circle cx="200" cy="15" r="5" fill="#60A5FA"/>
    <text x="25" y="35" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="11">cubic-bezier(0.23, 1, 0.32, 1) — EASE-OUT RESPONSIVE</text>
  </g>

  <!-- Technical Spec Footer -->
  <text x="300" y="745" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">A5 FLYER SPEC // 148 x 210 mm // CMYK 300 DPI // BLEED 3mm</text>
</svg>
