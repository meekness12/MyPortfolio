<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1422" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_r1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07090E"/>
      <stop offset="50%" stop-color="#0E131F"/>
      <stop offset="100%" stop-color="#05070A"/>
    </linearGradient>
    <linearGradient id="cyan_glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="stand_metal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <pattern id="grid_dots" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#3B82F6" fill-opacity="0.12"/>
    </pattern>
  </defs>

  <!-- Top Clamp / Aluminum Hanging Bar -->
  <rect x="60" y="20" width="680" height="18" rx="4" fill="url(#stand_metal)"/>
  
  <!-- Main Banner Canvas (850 x 2000 mm scaled) -->
  <rect x="70" y="38" width="660" height="1320" rx="2" fill="url(#bg_r1)"/>
  <rect x="70" y="38" width="660" height="1320" fill="url(#grid_dots)"/>

  <!-- Geometric Grid & Accent Lines -->
  <line x1="70" y1="180" x2="730" y2="180" stroke="#334155" stroke-width="1"/>
  <line x1="120" y1="38" x2="120" y2="1358" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>
  <line x1="680" y1="38" x2="680" y2="1358" stroke="#1E293B" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- Top Event Eyebrow -->
  <rect x="120" y="80" width="180" height="32" rx="16" fill="#06B6D4" fill-opacity="0.15" stroke="#06B6D4" stroke-width="1"/>
  <text x="210" y="101" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700" letter-spacing="2" text-anchor="middle">OCTOBER 24-26, 2026</text>

  <text x="680" y="101" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" letter-spacing="1" text-anchor="end">KIGALI CONVENTION CENTRE</text>

  <!-- Main Headline Block -->
  <text x="120" y="270" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">GLOBAL TECH</text>
  <text x="120" y="345" fill="url(#cyan_glow)" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">INNOVATORS</text>
  <text x="120" y="420" fill="#FFFFFF" font-family="'Space Grotesk', 'Inter', sans-serif" font-size="64" font-weight="800" letter-spacing="-1.5">SUMMIT 2026</text>

  <!-- Subheadline -->
  <text x="120" y="480" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="20" font-weight="400">Architecting Autonomous Systems, Edge AI &amp; Cloud Infrastructure</text>

  <!-- 3D Geometric Focal Illustration in Banner -->
  <g transform="translate(400, 720)">
    <circle cx="0" cy="0" r="160" fill="none" stroke="#1E293B" stroke-width="2"/>
    <circle cx="0" cy="0" r="120" fill="none" stroke="#06B6D4" stroke-opacity="0.3" stroke-width="1.5" stroke-dasharray="6 6"/>
    <!-- Isometric Cube Wireframe -->
    <path d="M0 -90 L80 -45 L80 45 L0 90 L-80 45 L-80 -45 Z" fill="#0E1726" fill-opacity="0.8" stroke="#3B82F6" stroke-width="2.5"/>
    <path d="M0 -90 L0 0 L80 45 M0 0 L-80 45" stroke="#06B6D4" stroke-width="2.5"/>
    <circle cx="0" cy="0" r="8" fill="#06B6D4"/>
    <circle cx="80" cy="-45" r="5" fill="#3B82F6"/>
    <circle cx="-80" cy="-45" r="5" fill="#3B82F6"/>
    <circle cx="80" cy="45" r="5" fill="#3B82F6"/>
    <circle cx="-80" cy="45" r="5" fill="#3B82F6"/>
  </g>

  <!-- Keynote Speakers Track Info -->
  <rect x="120" y="930" width="560" height="150" rx="12" fill="#141A28" stroke="#1E293B" stroke-width="1.5"/>
  <text x="150" y="970" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="700">KEYNOTE SESSIONS &amp; EXHIBITION</text>
  
  <text x="150" y="1010" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">09:00 AM</text>
  <text x="250" y="1010" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="14">Opening: The Autonomous Cloud Paradigm</text>
  
  <text x="150" y="1045" fill="#06B6D4" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">11:30 AM</text>
  <text x="250" y="1045" fill="#CBD5E1" font-family="'Inter', sans-serif" font-size="14">Panel: Distributed Intelligence &amp; Edge Protocols</text>

  <!-- Footer Info & QR Section -->
  <line x1="120" y1="1130" x2="680" y2="1130" stroke="#1E293B" stroke-width="1"/>

  <!-- QR Code Mockup -->
  <g transform="translate(120, 1160)">
    <rect x="0" y="0" width="120" height="120" rx="8" fill="#FFFFFF"/>
    <!-- QR pattern modules -->
    <rect x="10" y="10" width="30" height="30" fill="#0F172A"/>
    <rect x="16" y="16" width="18" height="18" fill="#FFFFFF"/>
    <rect x="80" y="10" width="30" height="30" fill="#0F172A"/>
    <rect x="86" y="16" width="18" height="18" fill="#FFFFFF"/>
    <rect x="10" y="80" width="30" height="30" fill="#0F172A"/>
    <rect x="16" y="86" width="18" height="18" fill="#FFFFFF"/>
    <rect x="50" y="15" width="20" height="15" fill="#0F172A"/>
    <rect x="15" y="50" width="15" height="20" fill="#0F172A"/>
    <rect x="50" y="50" width="25" height="25" fill="#06B6D4"/>
    <rect x="85" y="50" width="25" height="15" fill="#0F172A"/>
    <rect x="50" y="85" width="20" height="25" fill="#0F172A"/>
    <rect x="80" y="80" width="30" height="30" fill="#0F172A"/>
  </g>

  <text x="265" y="1200" fill="#FFFFFF" font-family="'Space Grotesk', sans-serif" font-size="22" font-weight="700">SCAN FOR VIP ACCESS</text>
  <text x="265" y="1230" fill="#94A3B8" font-family="'Inter', sans-serif" font-size="15">badge.kigalitechsummit.rw</text>
  <text x="265" y="1260" fill="#64748B" font-family="'JetBrains Mono', monospace" font-size="12">PRINT SPEC: 850x2000mm // CMYK 300 DPI // BLEED 3mm</text>

  <!-- Bottom Rollup Standee Base (Aluminum Retractable Unit) -->
  <rect x="50" y="1358" width="700" height="36" rx="6" fill="url(#stand_metal)"/>
  <rect x="65" y="1394" width="200" height="12" rx="3" fill="#1E293B"/>
  <rect x="535" y="1394" width="200" height="12" rx="3" fill="#1E293B"/>
</svg>
